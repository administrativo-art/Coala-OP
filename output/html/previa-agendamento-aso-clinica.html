<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prévia — Agendamento do ASO</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #fff8fc; color: #172033; font-family: Arial, sans-serif; padding: 40px 16px; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #fce7f3; border-radius: 24px; padding: 34px; box-shadow: 0 20px 50px rgba(236,72,153,.12); }
    .logo { display: block; width: 170px; height: auto; }
    h1 { margin: 28px 0 8px; font-size: 28px; }
    .person { margin: 0 0 26px; color: #526078; font-size: 15px; }
    label { display: block; margin-top: 18px; font-size: 14px; font-weight: 700; }
    input { display: block; width: 100%; height: 48px; margin-top: 8px; padding: 0 14px; border: 1px solid #d7dce5; border-radius: 12px; font-size: 16px; }
    button { width: 100%; height: 50px; margin-top: 24px; border: 0; border-radius: 12px; background: #ec4899; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
    .thanks { display: none; margin-top: 26px; padding: 22px; border-radius: 16px; background: #ecfdf5; color: #166534; }
    .thanks strong { display: block; margin-bottom: 6px; font-size: 19px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../../public/coala-email-logo.jpg" alt="Coala Shakes" />
    <section id="form-section">
      <h1>Data e horário do ASO</h1>
      <p class="person">Colaboradora: <strong>Colaboradora de Exemplo</strong></p>
      <form id="schedule-form">
        <label>Data<input type="date" required /></label>
        <label>Horário<input type="time" required /></label>
        <button type="submit">Enviar agendamento</button>
      </form>
    </section>
    <section id="thanks" class="thanks">
      <strong>Obrigado!</strong>
      O agendamento foi enviado ao RH da Coala Shakes.
    </section>
  </main>
  <script>
    document.getElementById('schedule-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    });
  </script>
</body>
</html>
