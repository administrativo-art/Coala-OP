# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  - variable: BIZNEO_TOKEN
    secret: BIZNEO_TOKEN
  - variable: PDVLEGAL_COD_EMPRESA
    secret: PDVLEGAL_COD_EMPRESA
  - variable: PDVLEGAL_TOKEN
    secret: PDVLEGAL_TOKEN
  - variable: PDVLEGAL_USERNAME
    secret: PDVLEGAL_USERNAME
  - variable: PDVLEGAL_PASSWORD
    secret: PDVLEGAL_PASSWORD
  - variable: FORMS_SCHEDULER_SECRET
    secret: FORMS_SCHEDULER_SECRET
  - variable: FORMS_SCHEDULER_WORKSPACE_ID
    value: coala
  - variable: FORMS_ANALYTICS_JOB_SECRET
    secret: FORMS_SCHEDULER_SECRET
  - variable: FORMS_ANALYTICS_JOB_WORKSPACE_IDS
    value: coala
  - variable: FORMS_ANALYTICS_PERSONAL_RETENTION_DAYS
    value: "365"
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: RESEND_WEBHOOK_SECRET
    secret: RESEND_WEBHOOK_SECRET
  - variable: RESEND_FORMALIZATION_FROM
    value: "RH Coala Shakes <formalizacao@coalashakes.com>"
  - variable: RESEND_ACCESS_FROM
    value: "Zé da Senha | Coala One <acesso@coalashakes.com>"
  - variable: AUTENTIQUE_API_TOKEN
    secret: AUTENTIQUE_API_TOKEN
  - variable: AUTENTIQUE_WEBHOOK_SECRET
    secret: AUTENTIQUE_WEBHOOK_SECRET
  - variable: AUTENTIQUE_SANDBOX
    value: "true"
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://op.coalashakes.com"
