# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Server-side PDF rendering temporarily holds the rendered document,
  # letterhead image, and stamped PDF in memory at the same time.
  memoryMiB: 1024
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=4096"
    availability:
      - BUILD
  # O CI já executa typecheck. Estes ajustes afetam somente o build gerenciado
  # e mantêm o padrão local conservador de um worker com validação de tipos.
  - variable: COALA_NEXT_BUILD_CPUS
    value: "2"
    availability:
      - BUILD
  - variable: COALA_NEXT_SKIP_TYPECHECK
    value: "true"
    availability:
      - BUILD
  - variable: COALA_NEXT_WEBPACK_BUILD_WORKER
    value: "true"
    availability:
      - BUILD
  - variable: BIZNEO_TOKEN
    secret: BIZNEO_TOKEN
  - variable: PDVLEGAL_COD_EMPRESA
    secret: PDVLEGAL_COD_EMPRESA
  - variable: PDVLEGAL_TOKEN
    secret: PDVLEGAL_TOKEN
  - variable: PDVLEGAL_USERNAME
    secret: PDVLEGAL_USERNAME
  - variable: PDVLEGAL_PASSWORD
    secret: PDVLEGAL_PASSWORD
  - variable: FORMS_SCHEDULER_SECRET
    secret: FORMS_SCHEDULER_SECRET
  - variable: FORMS_SCHEDULER_WORKSPACE_ID
    value: coala
  - variable: FORMS_ANALYTICS_JOB_SECRET
    secret: FORMS_SCHEDULER_SECRET
  - variable: FORMS_ANALYTICS_JOB_WORKSPACE_IDS
    value: coala
  - variable: FORMS_ANALYTICS_PERSONAL_RETENTION_DAYS
    value: "365"
  # Catálogo e pedidos de ausência no banco de RH. Só trocar depois do recibo
  # dp_absenceCatalogMigrations/active (scripts/migrate-absence-catalog.mts).
  - variable: DP_ABSENCE_CATALOG_DATABASE
    value: coala-rh
  # Etapa 3: aplicação de ausências na escala. Só ligar depois do recibo operacional ready.
  - variable: DP_ABSENCE_OPERATIONAL_GUARD
    value: "on"
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: RESEND_WEBHOOK_SECRET
    secret: RESEND_WEBHOOK_SECRET
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  - variable: OPENAI_ADMIN_KEY
    secret: OPENAI_ADMIN_KEY
  - variable: OPENAI_MONTHLY_CREDIT_BUDGET_USD
    value: "10"
  - variable: OPENAI_PREPAID_CREDIT_BALANCE_USD
    secret: OPENAI_PREPAID_CREDIT_BALANCE_USD
  - variable: OPENAI_PREPAID_CREDIT_BALANCE_AS_OF
    value: "2026-10-08T16:03:00-03:00"
  - variable: GOOGLE_CLOUD_BILLING_EXPORT_PROJECT_ID
    value: "smart-converter-752gf"
  - variable: GOOGLE_CLOUD_BILLING_MAX_BYTES_PER_QUERY
    value: "250000000"
  - variable: OPENAI_DOCUMENT_MODEL
    value: "gpt-5.6-terra"
  - variable: OPENAI_FINANCIAL_DOCUMENT_MODEL
    value: "gpt-5.6-terra"
  - variable: FINANCIAL_INBOUND_ADDRESS
    value: "cobrancas@entrada.coalashakes.com"
  - variable: ASO_INBOUND_DOMAIN
    value: "entrada.coalashakes.com"
  - variable: PAYMENT_DATA_ENCRYPTION_KEY
    secret: PAYMENT_DATA_ENCRYPTION_KEY
  - variable: INTER_CLIENT_ID
    secret: INTER_CLIENT_ID
  - variable: INTER_CLIENT_SECRET
    secret: INTER_CLIENT_SECRET
  - variable: INTER_CERTIFICATE_BASE64
    secret: INTER_CERTIFICATE_BASE64
  - variable: INTER_PRIVATE_KEY_BASE64
    secret: INTER_PRIVATE_KEY_BASE64
  - variable: INTER_WEBHOOK_SECRET
    secret: INTER_WEBHOOK_SECRET
  - variable: INTER_RECONCILIATION_SECRET
    secret: INTER_RECONCILIATION_SECRET
  # e-CNPJ A1 da desenvolvedora (chave + certificados em PEM) para PAdES do comprovante e CAdES do AFD.
  - variable: REP_P_ICP_SIGNER_PEM
    secret: REP_P_ICP_SIGNER_PEM
  # Bucket exclusivo dos pacotes AFD/AEJ. Cada objeto é gravado já com retenção Locked por 20 anos.
  - variable: REP_P_FISCAL_STORAGE_BUCKET
    value: "smart-converter-752gf-rep-p-fiscal"
  # ARP oficial isolada do RH/PTRP; ensaios e dados acessórios continuam no coala-rh.
  - variable: REP_P_FIRESTORE_DATABASE_ID
    value: "coala-rep-p"
  # Contato da CT Sorvetes LTDA, identificada como desenvolvedora do PTRP no AEJ.
  - variable: PTRP_DEVELOPER_EMAIL
    value: "administrativo@coalashakes.com"
  # HLB gratuita: consulta com quórum aos quatro servidores NTP publicados pelo Observatório Nacional.
  # Falha de rede, divergência ou desvio superior a 30 s bloqueia a marcação.
  - variable: REP_P_HLB_NTP_ENABLED
    value: "true"
  # Gate independente: a sondagem HLB pode operar, mas nenhuma batida real é aceita antes da liberação formal.
  - variable: REP_P_MARKING_ENABLED
    value: "false"
  # Mesmo depois de publicar a versão, o modo oficial só pode iniciar na competência de novembro.
  - variable: REP_P_OFFICIAL_START_DATE
    value: "2026-11-01"
  # Allowlist do piloto oficial de novembro; vazia ou ausente deve bloquear o modo oficial.
  - variable: REP_P_OFFICIAL_USER_IDS
    value: "fvrLOh1JOIOtU5QhZQZydN3UBf22,SShCdcgzs0ZkRrlTXpW0IZp4ABu2"
  # O Cloud Monitoring e o segredo da sonda externa entram na etapa de monitoramento,
  # depois que a rota pública e o piloto estiverem validados.
  - variable: REP_P_AVAILABILITY_POLICY_NAME
    value: "Coala REP-P — disponibilidade externa"
  - variable: REP_P_AVAILABILITY_CONDITION_NAME
    value: "REP-P indisponível em sondagens externas"
  - variable: REP_P_AVAILABILITY_MONITOR_SECRET
    secret: REP_P_AVAILABILITY_MONITOR_SECRET
  # Ensaio nominal pré-homologação: grava fora da ARP e nunca participa do fechamento/AFD/AEJ.
  - variable: REP_P_PILOT_ENABLED
    value: "true"
  - variable: REP_P_PILOT_USER_IDS
    value: "fvrLOh1JOIOtU5QhZQZydN3UBf22,SShCdcgzs0ZkRrlTXpW0IZp4ABu2"
  # APK direto: passe verifica cadeia de hardware e assinatura do Coala Go.
  # A atestação geral permanece observável no ensaio; a contingência exige o passe abaixo.
  - variable: MOBILE_APP_ATTESTATION_MODE
    value: "monitor"
  - variable: REP_P_OFFLINE_ATTESTATION_MODE
    value: "enforce"
  - variable: MOBILE_APP_ATTESTATION_SECRET
    secret: MOBILE_APP_ATTESTATION_SECRET
  # O ensaio nominal não autoriza acompanhamento contínuo. Só ligar após decisão jurídica e novo rollout explícito.
  - variable: DP_JOURNEY_LOCATION_ENABLED
    value: "false"
  # Autentica a função agendada systemNoticesDailyMonitor na rota de avisos do sistema.
  - variable: SYSTEM_NOTICES_JOB_SECRET
    secret: SYSTEM_NOTICES_JOB_SECRET
  # Materialização diária dos planos preventivos na antecedência configurada em cada patrimônio.
  - variable: ASSET_MAINTENANCE_JOB_SECRET
    secret: ASSET_MAINTENANCE_JOB_SECRET
  - variable: INTER_SERVICE_PAYMENT_APPROVAL_ENABLED
    value: "true"
  - variable: INTER_SERVICE_PAYMENT_APPROVAL_SOURCE_IDS
