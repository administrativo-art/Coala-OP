<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Coala · Análise de vendas</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #E91E8C;
    --accent-soft: #fdf2f8;
    --bg: #f6f6f7;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: #18181b;
  }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.2); }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .animate-fade { animation: fade-in .18s ease-out }
  .animate-slide  { animation: slide-up .25s cubic-bezier(.2,.8,.2,1) }
  body.dark { background: #09090b; color: #fafafa; --bg: #09090b; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/data.jsx"></script>
<script type="text/babel" src="components/ui.jsx"></script>
<script type="text/babel" src="components/tweaks-panel.jsx"></script>
<script type="text/babel" src="components/sales-data.jsx"></script>
<script type="text/babel" src="components/sales-charts.jsx"></script>
<script type="text/babel" src="components/screen-sales.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": ["#E91E8C", "#fdf2f8"],
  "dark": false,
  "density": "regular"
}/*EDITMODE-END*/;

const ACCENT_OPTIONS = [
  ["#E91E8C", "#fdf2f8"],
  ["#4f46e5", "#eef2ff"],
  ["#0ea5a5", "#ecfeff"],
  ["#f97316", "#fff7ed"],
  ["#16a34a", "#f0fdf4"],
  ["#1e293b", "#f1f5f9"],
];

function Sidebar() {
  const items = [
    { icon: I.PieChart, id: "overview" },
    { icon: I.Layers, id: "stock", active: true },
    { icon: I.Flag, id: "goals" },
    { icon: I.Users, id: "team" },
    { icon: I.Receipt, id: "signage" },
    { icon: I.Wallet, id: "finance" },
    { icon: I.Settings, id: "settings" },
  ];
  return (
    <aside className="hidden md:flex w-[68px] shrink-0 flex-col items-center border-r border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 py-4">
      <span className="grid h-9 w-9 place-items-center rounded-xl mb-6" style={{ backgroundColor: "var(--accent)" }}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2C7.5 2 4 5.5 4 10c0 6 8 12 8 12s8-6 8-12c0-4.5-3.5-8-8-8z"/>
          <circle cx="12" cy="10" r="3" fill="white"/>
        </svg>
      </span>
      <nav className="flex flex-col items-center gap-1.5 flex-1">
        {items.map((it) => (
          <button key={it.id} className={`grid h-10 w-10 place-items-center rounded-xl transition ${
            it.active ? "bg-[--accent-soft] text-[--accent]" : "text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 hover:text-zinc-600"
          }`}>
            <it.icon size={18} />
          </button>
        ))}
      </nav>
      <span className="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-orange-400 to-rose-500 text-[12px] font-bold text-white">T</span>
    </aside>
  );
}

function Topbar() {
  return (
    <header className="sticky top-0 z-20 flex h-14 items-center gap-3 border-b border-zinc-200 dark:border-zinc-800 bg-white/85 dark:bg-zinc-950/85 backdrop-blur px-6">
      <div className="text-[15px] font-bold tracking-tight">Análise de Consumo</div>
      <div className="relative ml-4 hidden lg:block w-[320px]">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input placeholder="Buscar…" className="h-9 w-full rounded-lg bg-zinc-100/70 dark:bg-zinc-900 pl-9 pr-9 text-[12.5px] focus:ring-2 focus:ring-[--accent] outline-none"/>
        <span className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 rounded bg-white dark:bg-zinc-800 px-1.5 py-0.5 text-[9.5px] font-semibold text-zinc-500 ring-1 ring-zinc-200 dark:ring-zinc-700">⌘K</span>
      </div>
      <div className="ml-auto flex items-center gap-3">
        <span className="hidden sm:inline text-[12px] font-medium text-zinc-400 font-mono">29/05/2026 · 08:33</span>
        <button className="grid h-9 w-9 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-900"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        <button className="relative grid h-9 w-9 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-900"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span className="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500"></span></button>
        <span className="h-9 w-9 rounded-full bg-cover" style={{ backgroundImage: "linear-gradient(135deg,#64748b,#0f172a)" }}></span>
      </div>
    </header>
  );
}

function App() {
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.body.classList.toggle("dark", !!tweaks.dark);
    document.documentElement.classList.toggle("dark", !!tweaks.dark);
    const a = Array.isArray(tweaks.accent) ? tweaks.accent : [tweaks.accent];
    document.documentElement.style.setProperty("--accent", a[0]);
    document.documentElement.style.setProperty("--accent-soft", a[1] || a[0] + "1a");
  }, [tweaks]);

  const maxW = tweaks.density === "wide" ? "max-w-[1600px]" : "max-w-[1280px]";

  return (
    <div className="flex min-h-screen w-full">
      <div className="sticky top-0 h-screen self-start shrink-0">
        <Sidebar/>
      </div>
      <div className="flex min-w-0 flex-1 flex-col">
        <Topbar/>
        <main className="min-w-0 flex-1" data-screen-label="Análise de vendas">
          <div className={`mx-auto ${maxW} px-6 py-7 animate-slide`}>
            <SalesAnalysisScreen tweaks={tweaks} onBack={() => {}}/>
          </div>
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Cor da marca">
          <TweakColor label="Destaque" value={tweaks.accent} onChange={(v) => setTweaks("accent", v)} options={ACCENT_OPTIONS}/>
        </TweakSection>
        <TweakSection label="Layout">
          <TweakRadio label="Largura" value={tweaks.density} onChange={(v) => setTweaks("density", v)}
            options={[{ value: "regular", label: "Padrão" }, { value: "wide", label: "Largo" }]}/>
        </TweakSection>
        <TweakSection label="Tema">
          <TweakToggle label="Modo escuro" value={!!tweaks.dark} onChange={(v) => setTweaks("dark", v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
