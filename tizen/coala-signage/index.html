<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>Coala Signage</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage" aria-hidden="true">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
  </div>

  <section id="message" class="screen" hidden>
    <div class="brand"><span class="brand-logo"><img src="logo.png" alt="Coala Shakes"></span><span class="brand-divider"></span><span class="brand-name">Coala Signage</span></div>
    <h1 id="message-title"></h1>
    <p id="message-text"></p>
    <p id="message-note" class="note" hidden></p>
  </section>

  <section id="pairing" class="screen" hidden>
    <div class="brand"><span class="brand-logo"><img src="logo.png" alt="Coala Shakes"></span><span class="brand-divider"></span><span class="brand-name">Coala Signage</span></div>
    <h1>Conectar esta tela</h1>
    <p class="hint">No aplicativo Coala One, abra Signage, toque em “Adicionar tela” e leia este QR code.</p>
    <div class="qr-frame"><img id="pairing-qr" alt="QR code desta tela" hidden></div>
    <p id="pairing-code" class="pair-code"></p>
    <p id="pairing-status" class="status" role="status"></p>
    <p id="pairing-version" class="version"></p>
  </section>

  <section id="info" class="overlay" hidden>
    <div class="panel">
      <div class="brand"><span class="brand-logo"><img src="logo.png" alt="Coala Shakes"></span><span class="brand-divider"></span><span class="brand-name">Coala Signage</span></div>
      <h2 id="info-title"></h2>
      <dl id="info-lines"></dl>
      <div class="actions">
        <button type="button" id="info-close">Fechar</button>
        <button type="button" id="info-unpair">Trocar de tela</button>
      </div>
    </div>
  </section>

  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
