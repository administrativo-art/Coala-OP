name: verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checkout production promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Setup Java
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm ci
      - name: Enforce vulnerability ratchet
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm run check:vulnerabilities
      - name: Verify engineering map
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: |
          python3 scripts/generate-route-inventory.py --check
          python3 scripts/generate-surface-inventory.py --check
          python3 scripts/check-flow-matrix.py
          python3 scripts/generate-flow-entrypoints.py --check
          python3 scripts/check-engineering-docs.py
      - name: Verify Firebase rules
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm run check:rules
      - name: Verify application
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm run verify
      - name: Install Functions dependencies
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm ci
        working-directory: functions
      - name: Build Functions
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: npm run build
        working-directory: functions
      - name: Verify production promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          git show origin/main:scripts/verify-production-promotion.mjs > "$RUNNER_TEMP/verify-production-promotion.mjs"
          node "$RUNNER_TEMP/verify-production-promotion.mjs" --base "$BASE_SHA" --head "$HEAD_SHA" --main origin/main
